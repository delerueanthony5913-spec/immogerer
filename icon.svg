<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Ombre pour donner un effet 3D Premium -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2563EB" flood-opacity="0.15" />
    </filter>
    <!-- Dégradé bleu principal pour la villa -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Fond Blanc pur de l'application -->
  <rect width="512" height="512" rx="115" fill="#FFFFFF" />

  <!-- Symbole Villa Moderne (Centré) -->
  <g transform="translate(6, -10)" filter="url(#shadow)">
    <!-- Bloc gauche (Annexe / Salon) -->
    <rect x="120" y="160" width="140" height="120" rx="8" fill="#93C5FD" />
    <!-- Bloc droit (Étage principal de la villa) -->
    <rect x="220" y="100" width="160" height="180" rx="8" fill="url(#gradBlue)" />
    
    <!-- Toits plats modernes (Casquettes) -->
    <rect x="100" y="150" width="180" height="16" rx="8" fill="#1E40AF" />
    <rect x="200" y="90" width="200" height="16" rx="8" fill="#1E40AF" />
    
    <!-- Grandes baies vitrées -->
    <rect x="140" y="200" width="60" height="80" rx="6" fill="#FFFFFF" />
    <rect x="260" y="140" width="80" height="140" rx="6" fill="#FFFFFF" />
    
    <!-- Ligne de terrasse au sol -->
    <rect x="100" y="280" width="300" height="12" rx="6" fill="#94A3B8" opacity="0.3" />
  </g>

  <!-- TEXTE CADEL (Noir) -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="4">CADEL</text>
  
  <!-- TEXTE MANAGER (Bleu) - Rapproché de CADEL -->
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#2563EB" text-anchor="middle" letter-spacing="12">MANAGER</text>
</svg>
