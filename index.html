<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Ligne cruciale pour écraser le "V" par défaut -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Cadel Manager</title>
    
    <!-- LIAISON AVEC L'ICÔNE ET LE MANIFESTE -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CADEL" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
        body * { visibility: hidden !important; }
        .printable, .printable * { visibility: visible !important; }
        .printable {
          position: absolute !important;
          top: 0 !important; left: 0 !important;
          width: 100% !important;
          background: white !important;
          padding: 12px 20px !important;
          font-size: 9.5pt !important;
          box-sizing: border-box !important;
        }
        .printable table { border-collapse: collapse !important; width: 100% !important; }
        .printable th, .printable td { padding: 4px 8px !important; font-size: 9pt !important; }
        .no-print { display: none !important; }
      }
    </style>
    <script id="gis-script" src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
